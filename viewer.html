<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Court Filing Reader | JOHN C D DOE</title>
<style>body{margin:0;font:16px Arial;background:#102637;color:white}header{padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}a{color:#f4d194}iframe{border:0;width:100%;height:calc(100vh - 86px);background:white}p{margin:8px 20px}button{cursor:pointer}</style></head>
<body><header><a href="index.html#filings">← Back to filing list</a><strong id="heading">Court Filing Reader</strong><a id="direct" href="#" target="_blank" rel="noopener">Open PDF separately</a></header>
<p id="status">Loading court filing…</p><iframe id="reader" title="Court filing PDF" loading="eager"></iframe>
<script>
const name=new URLSearchParams(location.search).get("file")||"";
const ok=/^a(?:[1-9]|[1-9][0-9]|10[0-9]|110)\.pdf$/.test(name);
const status=document.getElementById("status"), frame=document.getElementById("reader");
if(ok){const url="filings/"+name;document.getElementById("heading").textContent="Filing "+name.replace(".pdf","").toUpperCase();document.getElementById("direct").href=url;frame.src=url+"#toolbar=1&navpanes=0";status.textContent="If the filing does not appear, its individual PDF has not yet been uploaded to the filings folder.";}
else{status.textContent="Invalid filing name.";document.getElementById("direct").hidden=true;}
</script></body></html>
