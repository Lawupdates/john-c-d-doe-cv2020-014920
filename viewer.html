<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Court Filing Reader | JOHN C D DOE</title>
<style>body{margin:0;font:16px Arial;background:#102637;color:white}header{padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}a{color:#f4d194}iframe{border:0;width:100%;height:calc(100vh - 86px);background:white}p{margin:8px 20px}button{cursor:pointer}
footer .latest-button{display:inline-block;padding:10px 16px;background:#e9c86f;color:#0b1d2a!important;border:1px solid #c69a3a;border-radius:3px;text-decoration:none;font:700 14px Arial,Helvetica,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.14)}footer .latest-button:hover,footer .latest-button:focus-visible{background:#fff3c4;color:#0b1d2a!important;text-decoration:underline}
</style></head>
<body><header><a href="index.html#filings">← Back to filing list</a><strong id="heading">Court Filing Reader</strong><a id="direct" href="#" target="_blank" rel="noopener">Open PDF separately</a></header>
<p id="status">Loading court filing…</p><iframe id="reader" title="Court filing PDF" loading="eager"></iframe>
<script>
const name=new URLSearchParams(location.search).get("file")||"";
const ok=/^a(?:[1-9]|[1-9][0-9]|10[0-9]|11[0-2])\.pdf$/.test(name);
const status=document.getElementById("status"), frame=document.getElementById("reader");
if(ok){const url="filings/"+name;document.getElementById("heading").textContent="Filing "+name.replace(".pdf","").toUpperCase();document.getElementById("direct").href=url;frame.src=url+"#toolbar=1&navpanes=0";status.textContent="The complete filing PDF is shown below, starting at page 1. Use the PDF page controls, thumbnails, or scroll to read every page. On a phone, tap “Open PDF separately” for easier reading.";}
else{status.textContent="Invalid filing name.";document.getElementById("direct").hidden=true;}
</script><footer style="padding:18px 20px;text-align:center;background:#102637;border-top:1px solid #c69a3a"><p><a class="latest-button" href="a112.pdf" target="_blank" rel="noopener noreferrer" aria-label="View latest archived filing, A112">View latest</a></p><p><a href="./">Main page</a></p></footer></body></html>
